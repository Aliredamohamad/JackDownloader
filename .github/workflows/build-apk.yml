name: Build Jack Downloader APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'JackDownloaderAndroid_Source.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Android project
        shell: bash
        run: |
          set -euo pipefail
          unzip -q JackDownloaderAndroid_Source.zip
          test -f JackDownloaderAndroid/app/build.gradle
          test -f JackDownloaderAndroid/settings.gradle
          # Fix FFmpeg import in the original source archive.
          sed -i 's/com.yausername.youtubedl_android.FFmpeg/com.yausername.ffmpeg.FFmpeg/g' JackDownloaderAndroid/app/src/main/java/com/jack/downloader/MainActivity.java

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile debug APK
        run: gradle -p JackDownloaderAndroid :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JackDownloader-APK
          path: JackDownloaderAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
