name: Build Jack Downloader Pro 1.5

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble professional Android source
        shell: bash
        run: |
          set -euo pipefail
          unzip -q JackDownloaderAndroid_Source.zip
          APP="JackDownloaderAndroid"
          SRC="$APP/app/src/main"
          cp professional/MainActivity.java "$SRC/java/com/jack/downloader/MainActivity.java"
          cp professional/DownloadService.java "$SRC/java/com/jack/downloader/DownloadService.java"
          cp professional/PlayerActivity.java "$SRC/java/com/jack/downloader/PlayerActivity.java"
          cp professional/TouchEffects.java "$SRC/java/com/jack/downloader/TouchEffects.java"
          cp professional/ClipboardDownloadPrompt.java "$SRC/java/com/jack/downloader/ClipboardDownloadPrompt.java"
          cp professional/ids.xml "$SRC/res/values/ids.xml"
          cp professional/AndroidManifest.xml "$SRC/AndroidManifest.xml"
          sed -i 's/minSdk 26/minSdk 24/' "$APP/app/build.gradle"
          sed -i "s/versionCode 1/versionCode 15/" "$APP/app/build.gradle"
          sed -i "s/versionName '1.0.0'/versionName '1.5.0'/" "$APP/app/build.gradle"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("JackDownloaderAndroid/app/src/main/res/layout/activity_main.xml")
          text=p.read_text()
          text=text.replace("نزّل الفيديو أو استخرج الصوت من رابط واحد", "نزّل بذكاء • احفظ الفيديو والصوت • افتح مكتبة الهاتف")
          text=text.replace("فتح الملفات المحمّلة", "مكتبة ملفات الهاتف")
          text=text.replace("يدعم الروابط العامة المتاحة فقط. لا يتجاوز DRM أو صلاحيات المواقع، وتختلف الجودة والصيغ حسب المصدر. أبقِ التطبيق مفتوحاً أثناء التنزيل.", "جودة وصيغة تلقائيتان افتراضياً. يعمل في الخلفية مع إشعارات. قد تختلف الميزات حسب المصدر، ولا يتجاوز DRM.")
          p.write_text(text)
          PY
          test -s "$SRC/java/com/jack/downloader/DownloadService.java"
          test -s "$SRC/java/com/jack/downloader/MainActivity.java"
          grep -q "catch (Throwable updateError)" "$SRC/java/com/jack/downloader/MainActivity.java"
          grep 'versionName' "$APP/app/build.gradle"

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build ARM64 Pro APK
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s/abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'/abiFilters 'arm64-v8a'/g" JackDownloaderAndroid/app/build.gradle
          gradle -p JackDownloaderAndroid :app:assembleDebug --no-daemon --stacktrace
          mkdir -p output
          cp JackDownloaderAndroid/app/build/outputs/apk/debug/app-debug.apk output/JackDownloader-Pro-1.5-arm64.apk

      - name: Build ARM32 Pro APK
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s/abiFilters 'arm64-v8a'/abiFilters 'armeabi-v7a'/g" JackDownloaderAndroid/app/build.gradle
          gradle -p JackDownloaderAndroid :app:clean :app:assembleDebug --no-daemon --stacktrace
          cp JackDownloaderAndroid/app/build/outputs/apk/debug/app-debug.apk output/JackDownloader-Pro-1.5-arm32.apk

      - name: Verify APKs and prepare source
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          for apk in output/*.apk; do
            unzip -tqq "$apk"
            "$APKSIGNER" verify --min-sdk-version 24 --verbose "$apk"
            sha256sum "$apk"
            ls -lh "$apk"
          done
          (cd output && sha256sum JackDownloader-Pro-1.5-arm64.apk JackDownloader-Pro-1.5-arm32.apk > SHA256SUMS.txt)
          (cd JackDownloaderAndroid && zip -qr ../output/JackDownloader-Pro-Source.zip \
            app/src app/build.gradle settings.gradle build.gradle gradle.properties README.md)
          unzip -tqq output/JackDownloader-Pro-Source.zip

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: JackDownloader-Pro-1.5
          path: output/*
          if-no-files-found: error
          retention-days: 21

      - name: Publish direct APK links
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.5.0 >/dev/null 2>&1; then
            gh release upload v1.5.0 output/* --clobber
          else
            gh release create v1.5.0 output/* \
              --title "Jack Downloader Pro 1.5.0" \
              --notes "New in 1.5: improved download reliability with format fallback attempts, automatic extractor/network retries, removal of forced MP4 transcoding in auto mode, and in-app yt-dlp stable update check. Shows specific causes for unavailable, private, rate-limited, geo-restricted or unsupported links; added button to copy diagnostic errors. Automatic mode now retries simpler combined streams when FFmpeg conversion fails. Source websites may still block access or require login; DRM remains unsupported. All player, clipboard and UI features from v1.4 remain. Includes all 1.3 video/audio player and UI improvements. Includes existing smart clipboard, auto format and quality, background downloads and notifications. Both APKs verified with apksigner and ZIP integrity check. IMPORTANT: this build uses a new temporary debug signature: uninstall the previously installed Jack Downloader before installing this version. Media files saved under Download/Jack Downloader remain intact. Android 7.0+. No DRM bypass."
          fi
